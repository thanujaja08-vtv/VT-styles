<!DOCTYPE html>
<html>
<head>
    <title>VT Styles</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, black, purple);
            color: white;
        }

        nav {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .btn {
            background: orange;
            padding: 10px 20px;
            color: black;
            border-radius: 5px;
            text-decoration: none;
        }

        .section {
            padding: 40px;
            text-align: center;
        }

        .card {
            background: white;
            color: black;
            padding: 15px;
            margin: 15px auto;
            width: 80%;
            border-radius: 15px;
        }

        .form-box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 85%;
            border-radius: 20px;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }

        .btn2 {
            background: linear-gradient(to right, blue, purple);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</nav>

<div class="hero">
    <h1>Welcome to VT Styles 😎</h1>
    <p>Fashion • Fabric • Vibes 🔥</p>
    <br>
    <a class="btn" href="#contact">Contact Us</a>
</div>

<div class="section" id="about">
    <h2>About Us</h2>
    <p>We provide stylish fashion and quality fabrics with modern vibes.</p>
</div>

<div class="section" id="contact">
    <h2>Contact Us</h2>

    <div class="card">📧 contact@vtstyles.com</div>
    <div class="card">📞 +91 7406890302</div>
    <div class="card">📍 Bangalore, India</div>

    <div class="form-box">
        <input type="text" placeholder="Name"><br><br>
        <input type="email" placeholder="Email"><br><br>
        <input type="text" placeholder="Company / Organization"><br><br>
        <textarea placeholder="How can we help you?"></textarea><br><br>

        <button class="btn2">Start Conversation</button>
    </div>
</div>

</body>
</html>
