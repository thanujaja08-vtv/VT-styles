<!DOCTYPE html>
<html>
<head>
<title>VT Saree Services</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(45deg, #fff0f5, #ffe4e1, #fff);
    animation: bgMove 10s infinite alternate;
}

@keyframes bgMove {
    0% {background-position: left;}
    100% {background-position: right;}
}

.header {
    text-align: center;
    padding: 20px;
    background: black;
    color: gold;
    font-size: 24px;
}

.card {
    background: white;
    padding: 15px;
    margin: 15px auto;
    width: 80%;
    border-radius: 15px;
    transition: 0.3s;
    text-align: center;
    font-size: 18px;
}

.card:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px gold;
}

.slider {
    width: 90%;
    margin: auto;
    overflow: hidden;
}

.slides {
    display: flex;
    animation: slide 12s infinite;
}

.slides img {
    width: 100%;
    border-radius: 10px;
}

@keyframes slide {
    0% {transform: translateX(0);}
    33% {transform: translateX(-100%);}
    66% {transform: translateX(-200%);}
}

.btn {
    display: block;
    width: fit-content;
    margin: 20px auto;
    padding: 12px 20px;
    background: green;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    transition: 0.3s;
}

.btn:hover {
    background: darkgreen;
    box-shadow: 0 0 15px green;
}

.footer {
    text-align: center;
    padding: 15px;
    background: black;
    color: white;
}
</style>

</head>

<body>

<div class="header">
🧵 VT Saree Services 👗
</div>

<!-- Image Slider -->

    <div class="slides">
        <img src="https://i.imgur.com/8Km9tLL.jpg">
        <img src="https://i.imgur.com/5tj6S7Ol.jpg">
        <img src="https://i.imgur.com/9Jg6K7Ol.jpg">
    </div>
</div>

<!-- Services -->
<div class="card">✨ Saree Pre-Pleating</div>
<div class="card">💫 Fluffy Pleating</div>
<div class="card">👗 Bridal Saree Setting</div>

<!-- Contact -->
<div class="card">📞 +91 7406890302</div>

<!-- WhatsApp Button -->
<a class="btn" href="https://wa.me/917406890302?text=Hi%20I%20need%20saree%20service" target="_blank">
Message on WhatsApp 💬
</a>

<div class="footer">
For more enquiries, please contact us
</div>

</body>
</html>
